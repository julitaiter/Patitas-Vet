{% extends 'base.html' %}
{% block title %}Eliminar {{ model }} | Patitas Vet{% endblock %}
{% block content %}
<section class="section-space"><div class="container"><div class="confirm-card reveal"><div class="confirm-icon danger"><i class="bi bi-trash3"></i></div><span class="eyebrow">Confirmación</span><h1>Eliminar {{ obj.nombre }}</h1><p>Esta acción no se puede deshacer. Revisá que no existan relaciones que necesites conservar.</p><form method="post">{% csrf_token %}<div class="form-actions justify-content-center"><button class="btn btn-danger btn-lg" type="submit">Sí, eliminar</button><a href="{% url 'listar_catalogo' %}" class="btn btn-soft btn-lg">Cancelar</a></div></form></div></div></section>
{% endblock %}
