{% extends 'base.html' %}
{% block title %}Cerrar sesión | Patitas Vet{% endblock %}
{% block content %}<section class="section-space"><div class="container"><div class="confirm-card reveal"><div class="confirm-icon"><i class="bi bi-box-arrow-right"></i></div><span class="eyebrow">Tu cuenta</span><h1>¿Querés cerrar sesión?</h1><p>Podés volver a ingresar cuando quieras con tus credenciales.</p><form method="post" action="{% url 'account_logout' %}">{% csrf_token %}<div class="form-actions justify-content-center"><button class="btn btn-primary-app btn-lg" type="submit">Cerrar sesión</button><a href="{% url 'index' %}" class="btn btn-soft btn-lg">Cancelar</a></div></form></div></div></section>{% endblock %}
