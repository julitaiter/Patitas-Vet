{% extends 'base.html' %}
{% block title %}Eliminar sala | Patitas Vet{% endblock %}
{% block content %}<section class="section-space"><div class="container"><div class="confirm-card reveal"><div class="confirm-icon danger"><i class="bi bi-door-closed"></i></div><span class="eyebrow">Confirmación</span><h1>Eliminar {{ sala.nombre }}</h1><p>Si la sala ya está relacionada con turnos o disponibilidades, es preferible marcarla como inactiva.</p><form method="post">{% csrf_token %}<div class="form-actions justify-content-center"><button class="btn btn-danger btn-lg" type="submit">Eliminar sala</button><a href="{% url 'gestionar_salas' %}" class="btn btn-soft btn-lg">Cancelar</a></div></form></div></div></section>{% endblock %}
